services:
  postgres:
    image: postgres:16
    container_name: retailflow-postgres

    environment:
      POSTGRES_DB: retailflow
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: