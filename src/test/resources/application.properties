spring.datasource.url=jdbc:h2:mem:retailflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Fail the build if Hibernate cannot create a table (e.g. a column name
# that collides with a reserved word). Without this Hibernate only logs
# the DDL error, which is how the discounts.value issue slipped through.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Values required by JwtService and AdminSeeder so the test context
# does not depend on real environment variables (JWT_SECRET etc.).
jwt.secret=test-secret-key-for-local-testing-0123456789abcdef
jwt.expiration-ms=3600000
ADMIN_USERNAME=admin
ADMIN_PASSWORD=admin123